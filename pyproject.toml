[project]
name = "laxpxp-pyspark"
version = "0.1.0"
description = "NCAA Lacrosse Play-by-Play Data Platform"
readme = "README.md"
requires-python = ">=3.11, <3.13"
dependencies = [
    "pyspark>=3.5.0",
    "duckdb>=1.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "strawberry-graphql[fastapi]>=0.220.0",
    "pyarrow>=15.0.0",
    "pytest>=8.0.0",
    "delta-spark>=4.4.0",
    "httpx2>=2.13.1",
    "httpx>=0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
filterwarnings = [
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning",
]
