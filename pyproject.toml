[project]
name = "laxpxp-pyspark"
version = "0.1.0"
description = "NCAA Lacrosse Play-by-Play Data Platform"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11, <3.13"
dependencies = [
    "pyspark>=3.5.0",
    "duckdb>=1.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "strawberry-graphql[fastapi]>=0.220.0",
    "pyarrow>=15.0.0",
    "delta-spark>=4.4.0",
    # HTTP client for runtime data ingestion (src/ingestion/ingest.py)
    "httpx>=0.28.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.16.10",
    # Required by starlette.testclient (used via fastapi.testclient in Starlette >=1.6.0)
    # to avoid StarletteDeprecationWarning ("Using `httpx` with `starlette.testclient` is deprecated; install `httpx2` instead.")
    "httpx2>=2.13.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
target-version = "py312"
extend-exclude = ["benchmarks/output"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# These comparisons build PySpark Column expressions, not Python truth tests.
"src/etl/transform.py" = ["E712"]

[tool.pytest.ini_options]
filterwarnings = [
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning",
]
